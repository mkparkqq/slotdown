[project]
name = "slotdown"
version = "0.1.0"
description = "Template engine that keeps AI-generated markdown documents structurally consistent"
readme = "README.md"
authors = [
    { name = "Minkeun Park", email = "mkparkqq@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
slotdown = "slotdown.cli:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
